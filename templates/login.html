{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion | ADEXPER</title>
<link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">

   <link rel="stylesheet" href="{% static 'css/stylelogin.css' %}" />
</head>
<body>
<div class="card">
  <div class="logo">
  <div class="logo-icon">
  <img src="{% static 'images/logo_adexpert.png' %}" alt="ADEXPER">
</div>
    <h1>ADEXPER</h1>
    <p>Gestion Locative - Bujumbura</p>
  </div>

  <!-- Message expiration session -->
  <div id="alert-timeout" class="alert alert-warn" style="display:none;">
    &#9201; Votre session a expiré après 5 minutes d'inactivité. Veuillez vous reconnecter.
  </div>

  <div id="alert" class="alert"></div>

  <div class="fg">
    <label>Nom d'utilisateur</label>
    <input type="text" id="username" placeholder="Votre identifiant" autocomplete="username">
  </div>
  <div class="fg">
    <label>Mot de passe</label>
    <input type="password" id="password" placeholder="..." autocomplete="current-password">
  </div>
  
  <button class="btn" id="btn-login" onclick="doLogin()">Se connecter</button>
  
  <!-- Séparateur -->
  <div class="divider">ou</div>
  
  <!-- Bouton d'inscription -->
  <button class="btn-register" onclick="window.location.href='/register/'">
    Créer un compte
  </button>
</div>

<!-- Footer -->
<footer class="footer">
  <div>&copy; 2026 <strong>ADEXPER</strong> &mdash; InfinityHome</div>
  <div class="footer-dots">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <div>Gestion Locative &middot; Bujumbura, Burundi &middot; <a href="#">Support</a></div>
</footer>

<script>
// Afficher le message si session expirée
(function(){
  var params = new URLSearchParams(window.location.search);
  if(params.get('timeout') === '1'){
    document.getElementById('alert-timeout').style.display = 'flex';
  }
})();

var csrfToken='';
async function fetchCsrf(){
  try{var r=await fetch('/api/auth/csrf/');var d=await r.json();csrfToken=d.csrfToken||'';}
  catch(e){console.warn('CSRF fetch failed',e);}
}
fetchCsrf();
document.getElementById('password').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
function showAlert(msg,isErr){var el=document.getElementById('alert');el.textContent=msg;el.className='alert '+(isErr?'alert-err':'alert-ok');el.style.display='block';}
function fillDemo(u,p){document.getElementById('username').value=u;document.getElementById('password').value=p;}
async function doLogin() {
  var btn = document.getElementById('btn-login');
  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value;
  
  // Validation des champs
  if (!username || !password) {
    showAlert('Veuillez remplir tous les champs.', true);
    return;
  }
  
  // Désactivation du bouton
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Connexion...';
  
  try {
    var response = await fetch('/api/auth/login/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrfToken
      },
      credentials: 'include',
      body: JSON.stringify({
        username: username,
        password: password
      }),
    });
    
    var data = await response.json();
    
    // Gestion des erreurs de réponse
    if (!response.ok) {
      var errorMsg = data.non_field_errors 
        ? data.non_field_errors[0] 
        : data.detail || data.message || 'Identifiants incorrects.';
      showAlert(errorMsg, true);
      btn.disabled = false;
      btn.innerHTML = 'Se connecter';
      return;
    }
    
    // Validation des données reçues
    if (!data.token || !data.username) {
      showAlert('Erreur de réponse du serveur. Veuillez réessayer.', true);
      btn.disabled = false;
      btn.innerHTML = 'Se connecter';
      return;
    }
    
    // Stockage des données dans localStorage
    localStorage.setItem('authToken', data.token);
    localStorage.setItem('username', data.username);
    localStorage.setItem('fullname', data.fullname || data.username);
    localStorage.setItem('role', data.role || 'lecteur');
    localStorage.setItem('peutEcrire', String(data.peutEcrire || false));
    localStorage.setItem('estAdmin', String(data.estAdmin || false));
    localStorage.setItem('locataire_id', data.locataire_id || '');
    localStorage.setItem('proprietaire_id', data.proprietaire_id || '');
    
    // Message de confirmation
    showAlert('Connexion réussie ! Redirection en cours...', false);
    
    // Redirection après un court délai
    setTimeout(function() {
      var role = data.role || 'lecteur';
      
      // Redirection selon le rôle
      switch(role) {
        case 'locataire':
          window.location.href = '/locataire/';
          break;
        case 'proprietaire':
          window.location.href = '/proprietaire/';
          break;
        case 'admin':
        case 'gestionnaire':
          window.location.href = 'dashboard/';
          break;
        default:
          // Lecteur ou rôle non reconnu → dashboard
          window.location.href = '/';
          break;
      }
    }, 600);
    
  } catch(error) {
    console.error('Erreur de connexion:', error);
    showAlert('Erreur réseau. Vérifiez votre connexion internet.', true);
  } finally {
    // Réactivation du bouton (sauf si redirection en cours)
    // On ne réactive pas si la redirection a déjà été déclenchée
    if (!btn.disabled) {
      btn.disabled = false;
      btn.innerHTML = 'Se connecter';
    }
  }
}
</script>
</body>
</html>
