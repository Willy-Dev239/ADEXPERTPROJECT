{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome | ADEXPER </title>
<link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f3f5fb;
    --navy:#0c4a6e;
    --navy2:#0369a1;
    --blue:#38bdf8;
    --blue-dark:#0ea5e9;
    --text-dark:#1c2333;
    --text-muted:#5b6b8c;
    --card-bg:#ffffff;
    --border:#e4e8f4;
    --locked-bg:#f4f6fb;

    /* Vitrine lecteur — thème sombre */
    --gold:#c99b4a;
    --dark-1:#0c4a6e;
    --dark-2:#075985;
    --dark-card:#0a5178;
    --dark-border:#0e6ba8;
    --ink-light:#eef2fb;
    --ink-muted:#bfe3fb;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--bg);
    color:var(--text-dark);
  }

  /* ===== Barre unique : marque + nav vitrine + compte ===== */
  header{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);
    color:#fff;
    padding:0 28px;
    display:flex;
    align-items:center;
    gap:24px;
    position:sticky;
    top:0;
    z-index:30;
  }
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:17px;letter-spacing:0.3px;padding:14px 0;flex-shrink:0;}
  .brand .logo-icon{
    width:38px;height:38px;background:#fff;border-radius:10px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
  }
  .brand .logo-icon img{width:120%;height:120%;object-fit:cover;}

  .nav-center{
    display:none;
    flex:1;
    align-items:center;
    justify-content:center;
    gap:2px;
    overflow-x:auto;
  }
  .nav-center a{
    color:rgba(255,255,255,0.68);
    text-decoration:none;
    font-size:15px;
    font-weight:600;
    padding:20px 15px;
    white-space:nowrap;
    border-bottom:2px solid transparent;
  }
  .nav-center a:hover, .nav-center a:focus-visible{color:#fff;border-bottom-color:var(--blue);outline:none;}

  .lang-toggle{
    display:none;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:999px;
    padding:3px;
    font-size:12.5px;
    flex-shrink:0;
  }
  .lang-toggle button{border:none;background:transparent;color:rgba(255,255,255,0.65);padding:6px 13px;border-radius:999px;font-weight:700;font-family:inherit;cursor:pointer;}
  .lang-toggle button.active{background:var(--blue);color:#fff;}

  .who{display:flex;align-items:center;gap:12px;font-size:13px;flex-shrink:0;padding:14px 0;}
  .avatar{
    width:28px;height:28px;border-radius:50%;
    background:rgba(255,255,255,0.15);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:12px;
  }
  .badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:0.4px;}
  .badge-admin{background:#1f9d55;color:#fff;}
  .badge-lecteur{background:rgba(255,255,255,0.15);color:#fff;}
  .logout{
    background:transparent;border:1px solid rgba(255,255,255,0.35);color:#fff;
    padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12.5px;font-family:inherit;
  }
  .logout:hover{background:rgba(255,255,255,0.1);}

  @media (max-width:900px){
    #whoNameText{display:none;}
  }

  /* ===== Zone principale ===== */
  main{max-width:1000px;margin:0 auto;padding:28px 20px 60px;}
  main.full-bleed{max-width:none;margin:0;padding:0;}
  h2{font-size:19px;margin:0 0 4px;}
  .lead{color:var(--text-muted);font-size:13.5px;margin:0 0 24px;}

  /* ===== Contenu admin (inchangé) ===== */
  .welcome{
    background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%);
    border-radius:18px;padding:26px 28px;color:#fff;margin-bottom:24px;
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    box-shadow:0 12px 30px rgba(37,99,235,0.25);
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(210px,1fr));gap:16px;margin-bottom:24px;}
  .stat{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:18px;transition:box-shadow .15s, transform .15s;}
  .stat.open:hover{box-shadow:0 8px 20px rgba(59,130,246,0.12);transform:translateY(-2px);}
  .stat .label{font-size:11.5px;color:var(--text-muted);font-weight:700;letter-spacing:0.3px;}
  .stat .value{font-size:24px;font-weight:800;margin-top:6px;color:var(--text-dark);}
  section.admin-section{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:18px;}
  section.admin-section h3{margin:0 0 4px;font-size:15px;}
  section.admin-section h3 i{color:var(--blue);margin-right:8px;}
  section.admin-section p.desc{margin:0 0 14px;color:var(--text-muted);font-size:13px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:10px 10px;border-bottom:1px solid var(--border);}

  /* ===================================================== */
  /* ===== Vitrine société — compte Lecteur (plein écran) ===== */
  /* ===================================================== */
  .landing{font-family:'Work Sans', 'Segoe UI', Arial, sans-serif;background:var(--dark-1);color:var(--ink-light);}
  .landing .inner{max-width:1080px;margin:0 auto;padding:0 28px;}
  .landing h1, .landing h2, .landing h3{font-family:'Fraunces', Georgia, serif;}

  .landing-section{padding:76px 0;}
  .landing-section.alt{background:var(--dark-2);}

  .section-head-center{text-align:center;max-width:600px;margin:0 auto 46px;}
  .section-head-center .eyebrow{color:var(--blue);font-size:13px;font-weight:700;letter-spacing:1.2px;margin:0 0 12px;text-transform:uppercase;}
  .section-head-center h2{font-size:34px;font-weight:600;color:#fff;margin:0;line-height:1.2;}

  /* Hero plein écran, avec photo d'immeuble en arrière-plan */
  .hero{
    position:relative;
    padding:84px 0 0;
    background:
      linear-gradient(180deg, rgba(7,16,32,0.55) 0%, rgba(7,16,32,0.72) 55%, rgba(6,12,26,0.92) 100%),
      url("{% static 'images/hero-building-alt (1).jpg' %}");
    background-size:cover;
    background-position:center;
    overflow:hidden;
    min-height:580px;
  }
  .hero-content{position:relative;z-index:2;padding-bottom:76px;}
  .hero-badge{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(56,189,248,0.16);border:1px solid rgba(56,189,248,0.36);
    color:#bfe3fb;padding:8px 18px;border-radius:999px;font-size:13.5px;font-weight:600;margin-bottom:26px;
  }
  .hero-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);}
  .hero h1{font-size:58px;line-height:1.08;font-weight:600;color:#fff;margin:0 0 22px;max-width:720px;}
  .hero p{font-size:17.5px;line-height:1.7;color:var(--ink-muted);max-width:540px;margin:0 0 36px;}
  .hero-ctas{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:48px;}
  .btn-primary{background:var(--blue);color:#fff;border:1px solid var(--blue);padding:15px 26px;border-radius:9px;font-size:15px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px;}
  .btn-outline{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.25);padding:15px 26px;border-radius:9px;font-size:15px;font-weight:700;text-decoration:none;}
  .trust-row{display:flex;flex-wrap:wrap;gap:0;}
  .trust-row span{
    font-size:13.5px;color:var(--ink-muted);padding:0 18px 0 0;margin-right:18px;
    border-right:1px solid var(--dark-border);
  }
  .trust-row span:last-child{border-right:none;margin-right:0;}

  /* Pourquoi nous */
  .why-grid{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:center;}
  .why-grid .eyebrow{color:var(--blue);font-size:13px;font-weight:700;letter-spacing:1.2px;margin:0 0 12px;text-transform:uppercase;}
  .why-grid h2{font-size:34px;font-weight:600;color:#fff;margin:0 0 18px;line-height:1.2;}
  .why-grid > div:first-child > p{font-size:16.5px;line-height:1.7;color:var(--ink-muted);margin:0 0 28px;max-width:440px;}
  .why-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px;}
  .why-list li{display:flex;align-items:center;gap:14px;font-size:15.5px;color:var(--ink-light);}
  .why-list .ico{width:38px;height:38px;border-radius:10px;flex-shrink:0;background:rgba(56,189,248,0.14);border:1px solid rgba(56,189,248,0.3);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:15px;}
  .mockup{background:var(--dark-card);border:1px solid var(--dark-border);border-radius:14px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,0.4);}
  .mockup-bar{display:flex;gap:6px;padding:12px 14px;background:rgba(255,255,255,0.03);border-bottom:1px solid var(--dark-border);}
  .mockup-bar span{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.15);}
  .mockup-body{padding:38px 32px;}
  .mockup-body .who-label{display:block;font-size:12px;letter-spacing:0.5px;color:var(--ink-muted);margin-bottom:16px;font-family:'Work Sans',sans-serif;}
  .mockup-body blockquote{font-family:'Fraunces',serif;font-size:20px;line-height:1.5;color:#fff;margin:0;}
  .mockup-body blockquote b{color:var(--gold);}

  /* Services */
  .services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .service-card{background:var(--dark-card);border:1px solid var(--dark-border);border-radius:14px;overflow:hidden;}
  .service-photo{height:150px;position:relative;background-size:cover;background-position:center;}
  .service-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(12,74,110,0.15) 0%, rgba(9,20,38,0.85) 100%);}
  .service-photo i{position:absolute;bottom:14px;right:14px;font-size:30px;color:rgba(255,255,255,0.5);z-index:1;}
  .service-body{padding:22px;}
  .service-icon{width:38px;height:38px;border-radius:10px;background:rgba(56,189,248,0.14);border:1px solid rgba(56,189,248,0.3);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:16px;}
  .service-card h4{font-family:'Fraunces',serif;font-size:18.5px;font-weight:600;color:#fff;margin:0 0 10px;}
  .service-card p{font-size:14.5px;line-height:1.6;color:var(--ink-muted);margin:0;}

  /* Marquees */
  .marquee-wrap{overflow:hidden;margin-top:6px;}
  .marquee-track{display:flex;gap:18px;width:max-content;animation:marquee-scroll 34s linear infinite;}
  .marquee-card{width:300px;height:210px;border-radius:12px;flex-shrink:0;position:relative;overflow:hidden;background-size:cover;background-position:center;border:1px solid var(--dark-border);}
  .marquee-card::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.1) 60%);}
  .marquee-card i{position:absolute;top:20px;left:20px;font-size:26px;color:rgba(255,255,255,0.6);z-index:1;}
  .marquee-card span{position:absolute;bottom:16px;left:18px;right:18px;color:#fff;font-size:15.5px;font-weight:600;z-index:1;}

  .clients-track{display:flex;gap:18px;width:max-content;animation:marquee-scroll 26s linear infinite;}
  .client-card{width:230px;height:130px;flex-shrink:0;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;}
  .client-card .mark{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;font-family:'Fraunces',serif;}
  .client-card span{font-size:13.5px;font-weight:700;color:var(--text-dark);}

  @keyframes marquee-scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  @media (prefers-reduced-motion: reduce){.marquee-track, .clients-track{animation:none;}}

  /* Equipe */
  .team-row{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;}
  .avatar-lg{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-bottom:16px;}
  .team-card h4{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin:0 0 4px;color:#fff;}
  .team-card p{font-size:13.5px;color:var(--ink-muted);margin:0;}

  /* Galerie */
  .gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .gallery-item{border-radius:14px;overflow:hidden;height:230px;border:1px solid var(--dark-border);}
  .gallery-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s;}
  .gallery-item:hover img{transform:scale(1.05);}

  /* Contact */
  .contact-band{background:linear-gradient(135deg,var(--blue-dark) 0%, #0284c7 100%);color:#fff;border-radius:16px;padding:38px 34px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;}
  .contact-band h3{font-size:23px;margin:0 0 10px;font-weight:600;}
  .contact-band p{font-size:15px;color:#dbe6ff;margin:0;line-height:1.6;max-width:380px;}
  .contact-band .cta{background:#fff;color:var(--blue-dark);border:none;padding:13px 24px;border-radius:9px;font-size:14.5px;font-weight:700;text-decoration:none;white-space:nowrap;}
  .contact-note{font-size:12.5px;color:var(--ink-muted);margin-top:18px;}

  /* Footer */
  .landing-footer{background:var(--dark-1);padding:56px 0 30px;border-top:1px solid var(--dark-border);}
  .footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:44px;margin-bottom:36px;}
  .footer-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;color:#fff;margin-bottom:16px;font-family:'Work Sans',sans-serif;}
  .footer-brand .logo-icon-sm{width:32px;height:32px;background:var(--blue);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0;}
  .footer-tagline{font-size:14px;line-height:1.75;color:var(--ink-muted);margin:0 0 22px;max-width:320px;}
  .footer-social{display:flex;gap:10px;}
  .footer-social a{width:36px;height:36px;border-radius:9px;border:1px solid var(--dark-border);display:flex;align-items:center;justify-content:center;color:var(--ink-light);text-decoration:none;font-size:14px;}
  .footer-social a:hover{background:rgba(56,189,248,0.16);border-color:var(--blue);color:var(--blue);}
  .footer-col h5{font-size:14.5px;font-weight:700;color:#fff;margin:0 0 18px;font-family:'Work Sans',sans-serif;}
  .footer-col a{display:block;font-size:14px;color:var(--ink-muted);text-decoration:none;margin-bottom:13px;}
  .footer-col a:hover{color:var(--blue);}
  .footer-contact-item{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-muted);margin-bottom:13px;}
  .footer-contact-item i{color:var(--blue);width:16px;text-align:center;}
  .footer-bottom{border-top:1px solid var(--dark-border);padding-top:22px;font-size:12.5px;color:var(--ink-muted);text-align:center;}

  @media (max-width:780px){
    .footer-grid{grid-template-columns:1fr;gap:32px;}
  }

  @media (max-width:780px){
    .why-grid{grid-template-columns:1fr;}
    .services-grid{grid-template-columns:1fr 1fr;}
    .team-row{grid-template-columns:1fr 1fr;}
    .gallery-grid{grid-template-columns:1fr 1fr;}
    .hero h1{font-size:38px;}
  }
  @media (max-width:480px){
    .services-grid, .team-row, .gallery-grid{grid-template-columns:1fr;}
    .hero h1{font-size:30px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo-icon"><img src="{% static 'images/logo_adexpert.png' %}" alt="ADEXPER"></div>
    ADEXPERT
  </div>

  <nav class="nav-center" id="navCenter">
    <a href="#accueil" data-i18n="nav.accueil">Home</a>
    <a href="#services" data-i18n="nav.services">Services</a>
    <a href="#apropos" data-i18n="nav.apropos">About</a>
    <a href="#portfolio" data-i18n="nav.portfolio">Portfolio</a>
    <a href="#equipe" data-i18n="nav.equipe">Team</a>
    <a href="#contact" data-i18n="nav.contact">Contact</a>
  </nav>

  <div class="lang-toggle" id="langToggle">
    <button type="button" class="active" data-lang="en">EN</button>
    <button type="button" data-lang="fr">FR</button>
  </div>

  <div class="who">
    <div class="avatar" id="avatarInitial"></div>
    <span id="whoNameText"></span>
    <span class="badge" id="roleBadge"></span>
    <button class="logout" onclick="logout()"><i class="fas fa-sign-out-alt" style="margin-right:6px;"></i>Déconnexion</button>
  </div>
</header>

<main id="mainEl">
  <h2 id="pageTitle" style="display:none;">Tableau de bord</h2>
  <p class="lead" id="pageLead" style="display:none;"></p>

  <div id="content"></div>
</main>

<script>
  const authToken = localStorage.getItem('authToken');
  if(!authToken){
    window.location.href = "/login/";
  }
  const username   = localStorage.getItem('username') || '';
  const fullname   = (localStorage.getItem('fullname') || username || 'Utilisateur').trim();
  const role       = localStorage.getItem('role') || 'lecteur';
  const isAdmin    = (localStorage.getItem('estAdmin') === 'true') || role === 'admin';

  document.getElementById("whoNameText").textContent = fullname;
  document.getElementById("avatarInitial").textContent = (fullname.charAt(0) || '?').toUpperCase();

  const badge = document.getElementById("roleBadge");
  badge.textContent = isAdmin ? "ADMINISTRATEUR" : "LECTEUR";
  badge.className = "badge " + (isAdmin ? "badge-admin" : "badge-lecteur");

  const content = document.getElementById("content");
  const mainEl = document.getElementById("mainEl");

  if(isAdmin){
    document.getElementById("pageTitle").style.display = "block";
    document.getElementById("pageLead").style.display = "block";
    document.getElementById("pageLead").textContent =
      "Vue complète de la gestion locative — biens, contrats, locataires et finances.";
    content.innerHTML = `
      <div class="grid">
        <div class="stat open"><div class="label"><i class="fas fa-building" style="margin-right:4px;"></i>Biens gérés</div><div class="value">42</div></div>
        <div class="stat open"><div class="label"><i class="fas fa-users" style="margin-right:4px;"></i>Locataires actifs</div><div class="value">37</div></div>
        <div class="stat open"><div class="label"><i class="fas fa-coins" style="margin-right:4px;"></i>Loyers encaissés (mois)</div><div class="value">18 450 000 BIF</div></div>
        <div class="stat open"><div class="label"><i class="fas fa-exclamation-triangle" style="margin-right:4px;"></i>Impayés en cours</div><div class="value">2 950 000 BIF</div></div>
      </div>
      <section class="admin-section">
        <h3><i class="fas fa-file-signature"></i> Contrats récents</h3>
        <p class="desc">Derniers contrats société et coordonnées associées.</p>
        <table>
          <tr><th>Locataire</th><th>Bien</th><th>Loyer</th><th>Statut</th></tr>
          <tr><td>N. Ndikumana</td><td>Rohero — Villa 12</td><td>950 000 BIF</td><td>À jour</td></tr>
          <tr><td>C. Nzeyimana</td><td>Kinindo — App. 4B</td><td>620 000 BIF</td><td>En retard</td></tr>
          <tr><td>D. Bigirimana</td><td>Kabondo — Villa 3</td><td>1 100 000 BIF</td><td>À jour</td></tr>
        </table>
      </section>
      <section class="admin-section">
        <h3><i class="fas fa-user-cog"></i> Gestion des utilisateurs</h3>
        <p class="desc">Comptes inscrits sur la plateforme et leur rôle.</p>
        <table id="userTable"><tr><th>Nom d'utilisateur</th><th>E-mail</th><th>Rôle</th><th>Inscrit le</th></tr></table>
      </section>
    `;
    fetch('/api/auth/users/', { headers: { 'Authorization': 'Token ' + authToken } })
      .then(r => r.ok ? r.json() : [])
      .then(users => {
        const tbl = document.getElementById("userTable");
        (users.results || users).forEach(u => {
          const row = document.createElement("tr");
          row.innerHTML = `<td>${u.username}</td><td>${u.email || '—'}</td><td>${u.role}</td><td>${new Date(u.date_joined).toLocaleDateString('fr-FR')}</td>`;
          tbl.appendChild(row);
        });
      })
      .catch(() => {});

  } else {
    // ===== Compte Lecteur : vitrine société plein écran =====
    mainEl.classList.add("full-bleed");

  function logout(){
    fetch('/api/auth/logout/', {
      method: 'POST',
      headers: { 'Authorization': 'Token ' + authToken }
    }).catch(() => {}).finally(() => {
      localStorage.removeItem('authToken');
      localStorage.removeItem('username');
      localStorage.removeItem('fullname');
      localStorage.removeItem('role');
      localStorage.removeItem('peutEcrire');
      localStorage.removeItem('estAdmin');
      window.location.href = "/login/";
    });
